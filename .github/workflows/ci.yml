# Every gate the repository has, on every push and pull request.
#
# Nothing here needs a GPU. The serving (`vlm`), training (`vlm-train`) and
# change-detection (`cd`) stacks are optional extras; the backend job installs
# none of them, and every test that would touch them skips itself with
# `pytest.importorskip`. The suite the audit measured (503 backend, 194 frontend
# tests) is hermetic by design — this workflow is what makes that fact count.
#
# The jobs call the Makefile so the local `make ci` and this file cannot drift.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  # Cached pip/uv metadata lives in the runner's home; the project's .venv is
  # rebuilt from the lockfile every time.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    name: backend (ruff · mypy · pytest · openapi)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install (base + dev, no GPU extras)
        run: uv sync --group dev

      - name: ruff
        run: make backend-lint

      - name: mypy --strict
        run: make backend-typecheck

      - name: pytest (GPU-marked cases excluded)
        run: make backend-test

      - name: openapi.json is in sync with create_app()
        run: make backend-contract

  frontend:
    name: frontend (oxlint · tsc · vitest · schema · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs from the lockfile on a clean tree, which is the one
      # path that does not hit npm/cli#4828 (optional platform bindings skipped).
      - name: npm ci
        run: npm ci

      - name: schema.d.ts is in sync with openapi.json
        run: make -C .. frontend-contract

      - name: oxlint
        run: npm run lint

      - name: tsc
        run: npm run typecheck

      - name: vitest
        run: npm test

      - name: vite build
        run: npm run build

  e2e:
    name: frontend e2e (Playwright, offline mock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: overlay geometry spec
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: docker (frontend image · backend deps target)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The ROCm runtime target is several GB and needs the PyTorch index; CI
      # builds only what proves the Dockerfiles have not rotted.
      - name: backend deps target
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deps
          push: false
          tags: satquery-api:deps
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: satquery-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
