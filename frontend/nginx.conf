server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 512 MB per image, two images, plus the multipart envelope.
    client_max_body_size 1100m;

    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE: no buffering, no read timeout shorter than a long GPU step. The
        # API sends `: ping` every 15 s, so a 5-minute read timeout is generous.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Content-addressed artifacts are immutable (§4.6); honour the API's headers.
    location /v1/artifacts/ {
        proxy_pass http://api:8000/v1/artifacts/;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths render the app, which routes client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
