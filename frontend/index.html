<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="32x32 16x16" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser chrome takes the ground colour, so a phone's status bar
         and a desktop's title bar do not frame a dark console in white. Two
         entries, one per scheme; `applyTheme` keeps the live one honest. -->
    <meta name="theme-color" content="#100c0a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f5f1" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The theme, before first paint. The stored preference (or the system
         one) sets `.dark` here so the page never flashes the other ground;
         `useThemeStore` hydrates from the same key and agrees. -->
    <script>
      ;(function () {
        try {
          var pref = localStorage.getItem('satquery.theme')
          var dark =
            pref === 'light'
              ? false
              : pref === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                : true
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>

    <!-- Static fallbacks for crawlers that do not run JS; the React tree
         overrides every one of these per route (React 19 hoists head tags). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SatQuery AI" />
    <meta property="og:title" content="SatQuery AI — From space to answers, with the receipts" />
    <meta
      property="og:description"
      content="Bi-temporal and cross-modal SAR/optical satellite analysis where every number is bound to a measurement and the tool graph is part of the answer."
    />
    <meta property="og:image" content="%VITE_PUBLIC_ORIGIN%/og/landing.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="description"
      content="SatQuery AI — mission control for grounded Earth-observation analysis. Ask a question of satellite imagery and get an answer where every number is traced to the tool that measured it."
    />

    <!--
      Preload the body face only.

      Geist's Latin subset is on every screen from the first paint, so fetching
      it in parallel with the CSS rather than after it removes the one swap the
      user would actually notice. Geist Mono is deliberately not preloaded: it
      carries metadata — ids, chips, manifest fields — and it sits at
      size-adjust 100% against its fallback, so its swap costs no reflow and
      does not deserve to compete with the stylesheet for bandwidth.

      `crossorigin` is required even same-origin: fonts are fetched in CORS
      mode, and without it the browser downloads the file twice.
    -->
    <link
      rel="preload"
      href="/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>SatQuery AI — Mission Control</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
