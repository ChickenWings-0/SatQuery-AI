[project]
name = "satquery-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "geopandas>=1.1.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "rioxarray>=0.19.0",
    "scikit-image>=0.26.0",
    "shapely>=2.1.2",
    "sse-starlette>=3.4.11",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
# The transformers serving path. Not a base dependency: the deterministic layer,
# the API and the whole test suite run without it, and pulling ~3 GB of ROCm
# wheels into every environment to support one optional tool is the wrong
# default. Install with `uv sync --extra vlm` on the machine that serves.
vlm = [
    "accelerate>=1.11.0",
    "torch>=2.6.0",
    "transformers>=4.57.0",
]

# The Phase 7 VLM adaptation stack. Nothing in the serving path or the test
# suite imports it: satquery.training.vlm defers every one of these to the
# function body that needs it, so a checkout without them still type-checks and
# still runs 400+ tests. Install on the training box with
# `uv sync --extra vlm-train`.
#
# trl, transformers and peft are pinned exactly, not floored. The completion-only
# masking in satquery.training.vlm.qlora relies on trl's prompt-completion vision
# collator (`DataCollatorForVisionLanguageModeling._collate_prompt_completion`)
# and asserts against private trainer attributes (`_is_vision_dataset`,
# `completion_only_loss`) after construction; the layout fingerprint in
# satquery.models.prompts.layout depends on the processor's chat template and
# pixel budget. Every one of those has moved between minor releases
# (`DataCollatorForCompletionOnlyLM` was removed in trl 0.20; `assistant_only_loss`
# raises for vision datasets in 1.12). DOCS/ML_PIPELINE_RECOVERY_PLAN.md was
# verified line by line against exactly these versions; bump them together, and
# re-run scripts/preflight_train_serve_parity.py when you do.
vlm-train = [
    "accelerate>=1.11.0",
    "bitsandbytes>=0.48.0",
    "datasets>=4.0.0",
    "peft==0.20.0",
    "tensorboard>=2.19.0",
    "torch>=2.6.0",
    "transformers==5.16.1",
    "trl==1.12.0",
]

# The change-detection training stack. Serving a trained checkpoint needs only
# torch (through `vlm`, or on its own): tools/change_detect.py never imports
# Lightning or torchgeo, so a deployment box does not carry a trainer.
cd = [
    "lightning>=2.5.0",
    "torch>=2.6.0",
    "torchgeo>=0.7.0",
    "torchvision>=0.21.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

# The distribution is `satquery-ai`; the importable package is `satquery`. The
# `satquery_ai` scaffold that used to satisfy the default name was a leftover
# "Hello from satquery-ai!" module and is gone.
[tool.uv.build-backend]
module-name = "satquery"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "gpu: needs a ROCm/CUDA device and real weights; excluded in CI with -m 'not gpu'",
    "integration: needs the Qwen3-VL processor in the local HF cache (no weights, no GPU); skips itself elsewhere",
]
filterwarnings = [
    # Fixtures deliberately include a non-georeferenced PNG and an identity transform.
    "ignore::rasterio.errors.NotGeoreferencedWarning",
    "ignore:Use `@` matmul:PendingDeprecationWarning",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "D"]
ignore = ["D203", "D213", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
# `import torch.nn.functional as F` is the PyTorch convention. Renaming it to
# satisfy N812 would make the model read unlike every other PyTorch model.
"src/satquery/training/*" = ["N812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
packages = ["satquery"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

# Neither rasterio nor scikit-image ships type information, so their public API
# is Any to mypy. Everything we build on top of them stays strictly typed.
[[tool.mypy.overrides]]
module = ["rasterio.*", "skimage.*", "affine.*", "yaml", "pandas", "huggingface_hub"]
ignore_missing_imports = true
disallow_untyped_calls = false

# The serving stack is an optional extra (`uv sync --extra vlm`), so a checkout
# that never serves a model must still type-check. Both are imported inside
# function bodies and everything they return is handled as Any behind the
# GenerationResult boundary.
[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

# The training and fusion stack is the `cd` extra. A deployment checkout carries
# neither Lightning nor torchgeo — tools/crossmodal_dofa.py imports the latter
# inside a function body precisely so that it does not have to — and must still
# type-check, so the modules are declared missing rather than required.
[[tool.mypy.overrides]]
module = ["torchgeo.*", "lightning.*", "pytorch_lightning.*", "torchvision.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

# Phase 7's training stack (`uv sync --extra vlm-train`). peft, trl, datasets and
# bitsandbytes are imported inside function bodies in satquery.training.vlm, so a
# checkout that only serves — or only runs the tests — must still type-check.
[[tool.mypy.overrides]]
module = ["peft.*", "trl.*", "datasets.*", "bitsandbytes.*"]
ignore_missing_imports = true
implicit_reexport = true

# The CD model subclasses torch.nn.Module. On a checkout without torch (CI, a
# deployment box) the base class is Any, and --strict refuses to subclass Any;
# with torch present the same code is fully typed. The two relaxations below
# make the module type-check identically in both environments.
[[tool.mypy.overrides]]
module = ["satquery.training.cd.encoder", "satquery.training.cd.model"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

